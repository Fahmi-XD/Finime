name: Test Build

on:
  push:
    branches:
      - patch/fix-api-errors
  pull_request:
    branches:
      - patch/fix-api-errors

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: |
        cd backend
        npm install

    - name: Run build
      run: |
        cd backend
        npm run build
