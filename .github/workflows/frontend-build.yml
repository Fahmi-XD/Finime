name: Front End build test

on:
  push:
    branches:
      - patch/fix-api-errors
  pull_request:
    branches:
      - patch/fix-api-errors

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PUBLIC_API: ${{ secrets.PUBLIC_API }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '22' 

    - name: Install dependencies
      run: |
        cd frontend
        npm install
    
    - name: Copy examle env
      run: cp .env.example .env

    - name: Run build
      run: |
        cd frontend
        npm run build
